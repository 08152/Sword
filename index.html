<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Third Person GLB Game (GitHub Ready)</title>

<style>
  body { margin: 0; overflow: hidden; background: black; }
  #info {
    position: absolute;
    color: white;
    font-family: monospace;
    padding: 10px;
    z-index: 10;
  }
</style>
</head>

<body>

<div id="info">Initialisiere...</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

const info = document.getElementById("info");

// ---------------- SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// ---------------- CAMERA ----------------
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 3, 6);

// ---------------- RENDERER ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- LIGHT ----------------
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// ---------------- GROUND ----------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x228822 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ---------------- TEST CUBE ----------------
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(),
  new THREE.MeshBasicMaterial({ color: "red" })
);
cube.position.set(3, 1, 0);
scene.add(cube);

// ---------------- PLAYER ----------------
const player = new THREE.Group();
scene.add(player);

// Kamera Offset (Third Person)
const offset = new THREE.Vector3(0, 3, 6);

// ---------------- LOADER ----------------
const loader = new GLTFLoader();

info.innerText = "Lade 1.glb ...";

// 🔥 GLB LOAD (GitHub-safe)
loader.load(
  "1.glb",

  (gltf) => {
    const model = gltf.scene;

    model.scale.set(1, 1, 1);
    player.add(model);

    info.innerText = "✔ Model geladen!";
    console.log("GLB erfolgreich geladen");
  },

  (progress) => {
    if (progress.total) {
      const percent = Math.round((progress.loaded / progress.total) * 100);
      info.innerText = "Loading: " + percent + "%";
    }
  },

  (error) => {
    console.error(error);
    info.innerText = "❌ Fehler: 1.glb nicht gefunden!";
  }
);

// ---------------- CONTROLS ----------------
const keys = {};

window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

// ---------------- GAME LOOP ----------------
function animate() {
  requestAnimationFrame(animate);

  const speed = 0.1;

  if (keys["w"]) player.position.z -= speed;
  if (keys["s"]) player.position.z += speed;
  if (keys["a"]) player.position.x -= speed;
  if (keys["d"]) player.position.x += speed;

  // Kamera folgt Spieler smooth
  const camTarget = player.position.clone().add(offset);
  camera.position.lerp(camTarget, 0.08);
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}

animate();

// ---------------- RESIZE ----------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
